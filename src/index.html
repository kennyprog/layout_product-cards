<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <div class="card__container">
        <img
          src="images/imac.jpeg"
          alt="card"
          class="card__img"
        />
        <h4 class="card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h4>
        <p class="card__description">Product code: 195434</p>
        <div class="card__rate-wrapper">
          <div class="card__rate">
            <img
              src="images/star-active.svg"
              alt="star"
              class="card__star"
            />
            <img
              src="images/star-active.svg"
              alt="star"
              class="card__star"
            />
            <img
              src="images/star-active.svg"
              alt="star"
              class="card__star"
            />
            <img
              src="images/star-active.svg"
              alt="star"
              class="card__star"
            />
            <img
              src="images/star.svg"
              alt="star"
              class="card__star"
            />
          </div>
          <span class="card__rewiews">Reviews: 5</span>
        </div>
        <div class="card__price card__price--wrapper">
          <span class="card__price card__price--title">Price:</span>
          <span class="card__price">$2,199</span>
        </div>
        <a
          href="#"
          class="card__button"
          data-qa="hover"
        >
          Buy
        </a>
      </div>
    </div>
  </body>
</html>
